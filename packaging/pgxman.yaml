apiVersion: v1
name: pg_sift
version: "3.6.0"
homepage: https://github.com/brauliobo/pg_sift
repository: https://github.com/brauliobo/pg_sift
source: https://github.com/brauliobo/pg_sift/archive/refs/tags/v3.6.0.tar.gz
description: Exact BM25 full-text index and column-store aggregates for PostgreSQL.
license: PostgreSQL
keywords:
  - full-text-search
  - bm25
  - analytics
  - column-store
arch:
  - amd64
maintainers:
  - name: Braulio Oliveira
    email: brauliobo@gmail.com
buildDependencies:
  - liblz4-dev
  - libzstd-dev
  - libicu-dev
build:
  main:
    - name: Build pg_sift
      run: |
        make USE_PGXS=1
        DESTDIR=${DESTDIR} make USE_PGXS=1 install
pgVersions:
  - "17"
  - "18"
  - "19"
