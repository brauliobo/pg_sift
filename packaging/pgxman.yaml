apiVersion: v1
name: pg_sift
version: "6.0.0"
homepage: https://github.com/brauliobo/pg_sift
repository: https://github.com/brauliobo/pg_sift
source: https://github.com/brauliobo/pg_sift/archive/refs/tags/v6.0.0.tar.gz
description: "Columnar analytics and exact BM25 full-text search inside PostgreSQL — add an index or column table, keep your SQL."
license: PostgreSQL
keywords:
  - analytics
  - olap
  - columnar
  - bm25
  - full-text-search
arch:
  - amd64
  - arm64
maintainers:
  - name: Braulio Oliveira
    email: brauliobo@gmail.com
buildDependencies:
  - liblz4-dev
  - libzstd-dev
  - libicu-dev
build:
  main:
    - name: Build pg_sift
      run: |
        make USE_PGXS=1
        DESTDIR=${DESTDIR} make USE_PGXS=1 install
pgVersions:
  - "17"
  - "18"
  - "19"
