name: ci

# Only a pull request from an `integration/` branch, or one labeled `ci`, starts work; any other pull request skips every job (`gate` still passes). That one runs the
# fast tier: lint, and one PostgreSQL 18 job with the regression tests its diff can break (scripts/areas.tsv, `scripts/ci.sh affected`)
# and the tests it touches, a few minutes in all. A push to main runs everything the diff can break, PostgreSQL 17, 18 and 19, the TAP, differential and
# release-library stages and the other jobs; its base is the last green run of main, so a red or cancelled push is not forgotten by the next one.
# The nightly run and a dispatch (of main, or of a branch before the merge of a risky change) run every job of the quick tier ("Full scope" in the first job is
# the mark the release tool looks for); the nightly run, and a dispatch with heavy set, add the full tier (sanitizers, long soaks and fuzz runs). Only the full tier installs pg_repack (PGDG ships 1.5.3 for 17, 18 and 19), so test/t/col_pg_repack.sh runs there and skips elsewhere.
# PostgreSQL 19 (a server built from the git tree, cached: .github/actions/pg19) runs whatever PostgreSQL 17 and 18 run, in the same shards, and fails the run like them.
# The full tier is three shards on PostgreSQL 18 and five on 17 (the last one runs the jobs that install a library flavor): in one it took 92 minutes of tests on a 4-core runner and PostgreSQL 17 ran past the 150-minute limit.
# Linux on AArch64 (`arm: true` entries, a hosted ubuntu-24.04-arm runner) runs the PostgreSQL 18 entries again: the fast tier of a labeled pull request, the quick tier
# of a push, the nightly run and a dispatch.
# The memory-debugging lanes (assert, valgrind) are assert.yml, weekly.
# No scheduled run is enabled in this repository: dispatch the workflow to run it.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      heavy:
        description: Also run the full tier (make check-full)
        type: boolean
        default: false
      versions:
        description: 'The PostgreSQL majors of the quick tier, e.g. 18 for a branch with a large diff'
        default: '17 18 19'

permissions:
  contents: read
  actions: read

# a pull request run is cancelled by the next push to the same pull request. A push to main never cancels the run of the one before it: that run finishes, and of the
# runs waiting behind it GitHub keeps the newest, which scopes its diff from the last green run (see `changes`), so every batch of merges gets one complete run and
# the head of main is tested. A nightly or dispatch run has a group of its own, so a push never cancels it (main-verify.yml dispatches one when the head of main has none).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `changes` and `lint` start the work and carry the condition; the other jobs skip through `needs`. Any label other than `ci` starts a run of its own that skips
# everything, in a group of its own, so it does not cancel the run of the pull request.
jobs:
  changes:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'labeled' || github.event.label.name == 'ci') && (startsWith(github.head_ref, 'integration/') || contains(github.event.pull_request.labels.*.name, 'ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
      fast: ${{ steps.scope.outputs.fast }}
      fastjobs: ${{ steps.scope.outputs.fastjobs }}
      sqlite: ${{ steps.scope.outputs.sqlite }}
      mariadb: ${{ steps.scope.outputs.mariadb }}
      replication: ${{ steps.scope.outputs.replication }}
      macos: ${{ steps.scope.outputs.macos }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=all
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=origin/$GITHUB_BASE_REF ;;
            push)
              # the newest green run of main whose commit is an ancestor of this one: what it checked is not checked again
              for sha in $(gh run list --workflow ci.yml --branch main --status success --limit 20 --json headSha --jq '.[].headSha'); do
                git merge-base --is-ancestor "$sha" HEAD 2>/dev/null && { base=$sha; break; }
              done ;;
          esac
          echo "base: $base"
          scripts/ci.sh affected --list "$base" | tee -a "$GITHUB_STEP_SUMMARY"
          scripts/ci.sh affected --github "$base" | tee -a "$GITHUB_OUTPUT"

      # the mark of a run that covered everything (the release tool reads it from the API)
      - name: Full scope
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: echo "every job of the quick tier ran"

      - id: matrix
        env:
          NSHARDS: ${{ steps.scope.outputs.nshards }}
          PG: ${{ steps.scope.outputs.pg }}
          JOBS: ${{ steps.scope.outputs.jobs }}
          FAST: ${{ steps.scope.outputs.fast }}
          FASTJOBS: ${{ steps.scope.outputs.fastjobs }}
          VERSIONS: ${{ inputs.versions }}
          EVENT: ${{ github.event_name }}
          HEAVY: ${{ github.event_name == 'schedule' || inputs.heavy == true }}
        run: |
          # a pull request: one PostgreSQL 18 job, the regression tests of the areas the diff touches (`jobs`, narrower than the push's: scripts/areas.tsv `fast:` rows) and the tests it touches (`only`, SIFT_CI_JOBS)
          # PostgreSQL 17 has a shard more: its jobs that install a library flavor run one after the other, apart from the pool (scripts/ci.sh)
          jq -nc --argjson n "$NSHARDS" --argjson heavy "$HEAVY" --arg pg "$PG" --arg jobs "$JOBS" --arg fast "$FAST" --arg fastjobs "$FASTJOBS" --arg event "$EVENT" --arg versions "$VERSIONS" '
            if $event == "pull_request" then (if $pg == "true" then [false, true] | map({pg: 18, shard: 1, n: 1, tier: "fast", jobs: $fastjobs, only: $fast, arm: .}) else [] end) else
            (if $pg == "true" then [(17, 18) as $v | (if $v == 17 and $n > 1 then $n + 1 else $n end) as $m | range(1; $m + 1) as $s | {pg: $v, shard: $s, n: $m, tier: "quick", jobs: $jobs}]
              + [range(1; $n + 1) as $s | {pg: 19, shard: $s, n: $n, tier: "quick", jobs: $jobs, git: true}]
              + [range(1; $n + 1) as $s | {pg: 18, shard: $s, n: $n, tier: "quick", jobs: $jobs, arm: true}] else [] end)
            + if $heavy then [(17, 18) as $v | (if $v == 17 then 5 else 3 end) as $m | range(1; $m + 1) as $s | {pg: $v, shard: $s, n: $m, tier: "full", jobs: "."}] else [] end end
            | map(select($versions == "" or ((.pg | tostring) as $p | ($versions | split(" ") | index($p)) != null)))' |
            sed 's/^/matrix=/' | tee -a "$GITHUB_OUTPUT"

  # no PostgreSQL: the syntax of every script, the portable core, the map of areas against the tests, the workflows
  lint:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'labeled' || github.event.label.name == 'ci') && (startsWith(github.head_ref, 'integration/') || contains(github.event.pull_request.labels.*.name, 'ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - run: for f in scripts/*.sh test/t/*.sh bench/bench bench/*.sh; do bash -n "$f"; done
      - run: scripts/check-portable.sh
      - run: scripts/check-neutral.sh
      - run: scripts/gen-limits.sh --check
      - run: scripts/gen-reference.sh --check
      - run: scripts/gen-options.sh --check
      - run: scripts/check-errors.sh
      - run: scripts/check-memory.sh && scripts/check-memory.sh --selftest
      - run: scripts/check-bench-fresh.sh
      - run: git fetch -q --depth=1 origin integration/3.3-batch-1:refs/remotes/origin/integration/3.3-batch-1 || true; scripts/check-bench-cases.sh
      - run: scripts/gen-refusals.sh --check
      - run: scripts/coverage.sh --docs
      - run: scripts/gen-docs.py --check
      - run: scripts/ci.sh --selftest
      - name: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 && ./actionlint

  postgresql:
    name: PostgreSQL ${{ matrix.pg }}${{ matrix.arm && ' arm64' || '' }}${{ matrix.tier == 'full' && ' full tier' || matrix.tier == 'fast' && ' (fast)' || '' }}${{ matrix.n > 1 && format(' ({0}/{1})', matrix.shard, matrix.n) || '' }}${{ matrix.git && ' (git)' || '' }}
    needs: changes
    if: ${{ needs.changes.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.arm && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.tier == 'full' && 350 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The compatibility tests build released libraries from their tags.
          fetch-depth: 0

      - uses: ./.github/actions/apt-limits

      - name: Install PostgreSQL ${{ matrix.pg }}
        if: ${{ !matrix.git }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          # the tests start their own clusters: no default cluster, no service on 5432
          sudo apt-get install -y postgresql-common
          sudo sed -i 's/^#\?create_main_cluster.*/create_main_cluster = false/' /etc/postgresql-common/createcluster.conf
          sudo apt-get install -y --no-install-recommends postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} libipc-run-perl liblz4-dev libzstd-dev libicu-dev
          echo /usr/lib/postgresql/${{ matrix.pg }}/bin >> "$GITHUB_PATH"

      # the cached build of the newest commit of the branch (the nightly and dispatch runs build the head of it when the cache lacks it)
      - name: Get PostgreSQL 19
        if: ${{ matrix.git }}
        uses: ./.github/actions/pg19
        with:
          exact: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      - name: Use PostgreSQL 19
        if: ${{ matrix.git }}
        run: |
          sudo apt-get install -y --no-install-recommends libipc-run-perl liblz4-dev libzstd-dev libicu-dev
          echo "$HOME/pg19/bin" >> "$GITHUB_PATH"

      # PostgreSQL 17 has no extension_control_path: the tests install sift into the server's own directories
      - name: Install into the server (PostgreSQL 17)
        if: ${{ matrix.pg == 17 }}
        run: echo "SIFT_SUDO=sudo env PATH=$PATH" >> "$GITHUB_ENV"

      # the older releases the compatibility tests build (tags do not move; about 70 CPU seconds each); PostgreSQL 17 cannot hold two builds, and the
      # git build of the server changes with every run
      - name: Cache the older releases
        if: ${{ matrix.pg != 17 && !matrix.git }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/sift/old-lib/*/root
          key: old-lib-${{ runner.os }}-${{ runner.arch }}-pg${{ matrix.pg }}-${{ hashFiles('scripts/old-lib-check.sh', 'test/t/compat_31_column.sh', 'test/t/compat_matrix.sh', 'test/t/old_lib_refusal.sh') }}

      - name: Build
        run: |
          pg_config --version
          make -j4

      # the last stage of make check is the leak gate (scripts/leakcheck.sh): leak warnings, crashes and sanitizer
      # reports in the server logs of every suite, and the cluster checks recorded at each shutdown
      # includes the regression tests against the release library (SIFT_TESTING off, stage release-library-regress), with its own leak gate
      # the jobs: the ones scripts/areas.tsv picks for the diff (all of them in the nightly entries), and this runner's share of them (shard k of n)
      - name: ${{ matrix.tier == 'full' && 'Full test tier (make check-full)' || 'Quick test tier (make check, with the leak gate)' }}
        run: make ${{ matrix.tier == 'full' && 'check-full' || 'check' }}
        env:
          SIFT_CI_TMP: ${{ runner.temp }}/sift-ci
          SIFT_CI_AFFECTED: ${{ matrix.jobs }}
          SIFT_CI_JOBS: ${{ matrix.only }}
          SIFT_CI_NO_HARNESS: ${{ matrix.tier == 'fast' && '1' || '' }}
          SIFT_CI_SHARD: ${{ matrix.shard }}/${{ matrix.n }}

      - name: Keep the logs of a failed run
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: pg_sift-test-logs-pg${{ matrix.pg }}${{ matrix.arm && '-arm64' || '' }}-${{ matrix.tier }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/sift-ci/logs
            ${{ runner.temp }}/sift-ci/lane*/**/tap/**/*.log
            ${{ runner.temp }}/sift-ci/lane*/**/postgres.log
            ${{ runner.temp }}/sift-ci/lane*/**/sanitizer
            ${{ runner.temp }}/sift-ci/lane*/**/leakcheck.*
            ${{ runner.temp }}/sift-ci/lane*/regress/*/regression.diffs
            test/regression.diffs
          if-no-files-found: ignore

  # one container per node (primary, standby, subscriber): separate filesystems and installs of the extension
  replication:
    name: Replication in containers (${{ matrix.image }})
    needs: changes
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.replication == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [postgres:17, postgres:18]
    steps:
      - uses: actions/checkout@v6
      - run: PG_IMAGE=${{ matrix.image }} scripts/replication.sh --container

  # the SQLite extension (sqlite/): independent of PostgreSQL, built against the system SQLite development package
  sqlite:
    name: SQLite extension
    needs: changes
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.sqlite == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/apt-limits

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libsqlite3-dev sqlite3 python3
          sqlite3 --version

      # the portable-core check (the files of src/portable.list include only src/core/host.h), then: build, smoke test, baseline instruction check, 59 unit tests,
      # FTS5 differential on a synthetic corpus, all again with the scalar
      # kernels forced and for the vector-free build; then ASan+UBSan on both test files and the stress test, and TSan on the thread stress
      # test. The tests that need the 218k-article database or a pg_sift run are skipped, with a message, when their variables are unset.
      # vm.mmap_rnd_bits: the runner's address randomization is too wide for TSan's shadow memory.
      - name: Tests (sanitizers included)
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          SIFT_SANITIZE=1 sqlite/test.sh

  # the MariaDB extension (mariadb/): the portable-core check, then the release recipe for two series: build the library in the stock
  # mariadb:<series> image against the headers of its server, and load it into a server of that image (scripts/package-mariadb.sh,
  # mariadb/tests/smoke.sh). The full suite, mariadb/test.sh (218k-article corpus, pg_sift reference, InnoDB FULLTEXT, about 30 minutes
  # on a quiet machine), needs a PostgreSQL and the corpus and is run by hand before a release.
  mariadb:
    name: MariaDB extension (${{ matrix.series }})
    needs: changes
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.mariadb == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        series: ['11.8', '13.0']
    steps:
      - uses: actions/checkout@v6

      - run: scripts/check-portable.sh

      - name: Build and smoke-test the library of the series
        run: SERIES=${{ matrix.series }} scripts/package-mariadb.sh all HEAD dist-mariadb

  # Homebrew on macOS arm64, the one place that is not Linux: the formula of this checkout builds and passes its own test on PostgreSQL 17 and 18, and the
  # test harness runs on brew's bash 5 (a few regression tests; the stages that need GNU tools or /proc stay on Linux) while `make check` under the stock
  # /bin/bash 3.2 must stop with a message instead of exiting 0. It runs where scripts/areas.tsv says (gh:macos: the build, the harness and Formula/ are
  # `.`, so a core or harness change, the nightly run and a dispatch), never on a pull request that touches only sources or docs. Hosted macOS minutes are
  # free for a public repository (10x the Linux rate for a private one), hence the time limit.
  macos:
    name: macOS arm64 (Homebrew)
    needs: changes
    if: ${{ needs.changes.outputs.macos == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v6

      - name: Install bash 5 and PostgreSQL 17 and 18
        run: brew install bash postgresql@17 postgresql@18 lz4 zstd

      # the README install (a tap, brew install --HEAD, brew test) on this checkout: the formula is copied into a tap of its own with its head pointing here
      - name: Formula (brew install --HEAD, brew test)
        run: |
          git branch -f macos-ci HEAD
          brew tap-new --no-git local/ci
          mkdir -p "$(brew --repository local/ci)/Formula"
          sed "s|^  head .*|  head \"file://$PWD\", using: :git, branch: \"macos-ci\"|" Formula/pg_sift.rb >"$(brew --repository local/ci)/Formula/pg_sift.rb"
          brew install --HEAD local/ci/pg_sift
          brew test local/ci/pg_sift

      # the report this job answers: no brew bash on PATH, so `env bash` is /bin/bash 3.2
      - name: make check under the stock bash 3.2 fails with a message
        run: |
          /bin/bash --version | head -1
          if out=$(env PATH=/usr/bin:/bin:/usr/sbin:/sbin PG_CONFIG="$(brew --prefix postgresql@18)/bin/pg_config" make check 2>&1); then
            echo "$out"; echo "make check exited 0 under bash 3.2"; exit 1
          fi
          echo "$out"
          grep -q 'needs bash 4+' <<<"$out"

      - name: make check (regression tests) under brew bash 5
        env:
          SIFT_CI_TMP: ${{ runner.temp }}/sift-ci
          SIFT_CI_JOBS: '^installcheck-(facets|filter_pushdown)$'
          SIFT_CI_NO_HARNESS: 1
        run: |
          PATH="$(brew --prefix)/bin:$(brew --prefix postgresql@18)/bin:$PATH"; export PATH
          bash --version | head -1
          make check

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pg_sift-test-logs-macos
          path: |
            ${{ runner.temp }}/sift-ci/logs
            ${{ runner.temp }}/sift-ci/lane*/**/postgres.log
            ${{ runner.temp }}/sift-ci/lane*/regress/*/regression.diffs
          if-no-files-found: ignore

  # the one name for a branch ruleset to require: the shard names of the jobs above change with the diff and the event, this one does not.
  # A job that did not run (skipped) passes; a failed or cancelled one fails the gate
  gate:
    needs: [changes, lint, postgresql, replication, sqlite, mariadb, macos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: '! ${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}'
