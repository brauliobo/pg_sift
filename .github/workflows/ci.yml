name: ci

# A push or pull request runs what its diff can break (scripts/areas.tsv, `scripts/ci.sh affected`): the base of a push is the last green run of main, so a red
# or cancelled push is not forgotten by the next one. The nightly run and a dispatch run every job of the quick tier ("Full scope" in the first job is the
# mark the release tool looks for); the nightly run, and a dispatch with heavy set, add the full tier (sanitizers, long soaks and fuzz runs) and the
# experimental PostgreSQL 19. The memory-debugging lanes (assert, valgrind) are assert.yml, weekly.
# No scheduled run is enabled in this repository: dispatch the workflow to run it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      heavy:
        description: Also run the full tier (make check-full) and PostgreSQL 19
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# a push cancels the run of the one it supersedes; a nightly or dispatch run is never cancelled by a push
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # PostgreSQL 19 is built from this branch of the git tree until the PGDG packages carry it (from the GitHub mirror: git.postgresql.org dropped a clone with an early EOF)
  PG19_REF: REL_19_STABLE

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
      sqlite: ${{ steps.scope.outputs.sqlite }}
      mariadb: ${{ steps.scope.outputs.mariadb }}
      replication: ${{ steps.scope.outputs.replication }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=all
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=origin/$GITHUB_BASE_REF ;;
            push)
              # the newest green run of main whose commit is an ancestor of this one: what it checked is not checked again
              for sha in $(gh run list --workflow ci.yml --branch main --status success --limit 20 --json headSha --jq '.[].headSha'); do
                git merge-base --is-ancestor "$sha" HEAD 2>/dev/null && { base=$sha; break; }
              done ;;
          esac
          echo "base: $base"
          scripts/ci.sh affected --list "$base" | tee -a "$GITHUB_STEP_SUMMARY"
          scripts/ci.sh affected --github "$base" | tee -a "$GITHUB_OUTPUT"

      # the mark of a run that covered everything (the release tool reads it from the API)
      - name: Full scope
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: echo "every job of the quick tier ran"

      - id: matrix
        env:
          NSHARDS: ${{ steps.scope.outputs.nshards }}
          PG: ${{ steps.scope.outputs.pg }}
          JOBS: ${{ steps.scope.outputs.jobs }}
          HEAVY: ${{ github.event_name == 'schedule' || inputs.heavy == true }}
        run: |
          # PostgreSQL 17 has a shard more: its jobs that install a library flavor run one after the other, apart from the pool (scripts/ci.sh)
          jq -nc --argjson n "$NSHARDS" --argjson heavy "$HEAVY" --arg pg "$PG" --arg jobs "$JOBS" '
            (if $pg == "true" then [(17, 18) as $v | (if $v == 17 and $n > 1 then $n + 1 else $n end) as $m | range(1; $m + 1) as $s | {pg: $v, shard: $s, n: $m, tier: "quick", jobs: $jobs}] else [] end)
            + if $heavy then [(17, 18) as $v | {pg: $v, shard: 1, n: 1, tier: "full", jobs: "."}] + [{pg: 19, shard: 1, n: 1, tier: "quick", jobs: ".", experimental: true}] else [] end' |
            sed 's/^/matrix=/' | tee -a "$GITHUB_OUTPUT"

  # no PostgreSQL: the syntax of every script, the portable core, the map of areas against the tests, the workflows
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - run: for f in scripts/*.sh test/t/*.sh bench/bench bench/*.sh; do bash -n "$f"; done
      - run: scripts/check-portable.sh
      - run: scripts/check-neutral.sh
      - run: scripts/ci.sh --selftest
      - name: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 && ./actionlint

  postgresql:
    name: PostgreSQL ${{ matrix.pg }}${{ matrix.tier == 'full' && ' full tier' || '' }}${{ matrix.n > 1 && format(' ({0}/{1})', matrix.shard, matrix.n) || '' }}${{ matrix.experimental && ' (git, experimental)' || '' }}
    needs: changes
    if: ${{ needs.changes.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.tier == 'full' && 150 || 90 }}
    # an experimental server shows API drift without failing the workflow
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The compatibility tests build released libraries from their tags.
          fetch-depth: 0

      - name: Install PostgreSQL ${{ matrix.pg }}
        if: ${{ !matrix.experimental }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          # the tests start their own clusters: no default cluster, no service on 5432
          sudo apt-get install -y postgresql-common
          sudo sed -i 's/^#\?create_main_cluster.*/create_main_cluster = false/' /etc/postgresql-common/createcluster.conf
          sudo apt-get install -y --no-install-recommends postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} libipc-run-perl liblz4-dev libzstd-dev
          echo /usr/lib/postgresql/${{ matrix.pg }}/bin >> "$GITHUB_PATH"

      - name: Resolve the PostgreSQL 19 commit
        if: ${{ matrix.experimental }}
        id: pg19
        # the full ref: a bare name can match several refs, and two lines would break GITHUB_OUTPUT
        run: echo "sha=$(git ls-remote --exit-code https://github.com/postgres/postgres.git "refs/heads/$PG19_REF" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache PostgreSQL 19
        if: ${{ matrix.experimental }}
        id: pg19-cache
        uses: actions/cache@v5
        with:
          path: ~/pg19
          key: pg19-${{ runner.os }}-${{ steps.pg19.outputs.sha }}

      - name: Build PostgreSQL 19
        if: ${{ matrix.experimental && steps.pg19-cache.outputs.cache-hit != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex libipc-run-perl
          git clone --depth 1 --branch "$PG19_REF" https://github.com/postgres/postgres.git "$RUNNER_TEMP/postgresql"
          cd "$RUNNER_TEMP/postgresql"
          ./configure --prefix="$HOME/pg19" --enable-cassert --enable-debug --enable-tap-tests --without-icu --without-readline --without-zlib CFLAGS="-O1 -g"
          make -j4 -s
          make -s install
          # what the suites use besides the server: the TAP modules and two contrib modules
          make -s -C src/test/perl install
          make -s -C contrib/amcheck install
          make -s -C contrib/pg_walinspect install

      - name: Use PostgreSQL 19
        if: ${{ matrix.experimental }}
        run: |
          sudo apt-get install -y --no-install-recommends libipc-run-perl liblz4-dev libzstd-dev
          echo "$HOME/pg19/bin" >> "$GITHUB_PATH"

      # PostgreSQL 17 has no extension_control_path: the tests install sift into the server's own directories
      - name: Install into the server (PostgreSQL 17)
        if: ${{ matrix.pg == 17 }}
        run: echo "SIFT_SUDO=sudo env PATH=$PATH" >> "$GITHUB_ENV"

      - name: Build
        run: |
          pg_config --version
          make -j4

      # the last stage of make check is the leak gate (scripts/leakcheck.sh): leak warnings, crashes and sanitizer
      # reports in the server logs of every suite, and the cluster checks recorded at each shutdown
      # includes the regression tests against the release library (SIFT_TESTING off, stage release-library-regress), with its own leak gate
      # the jobs: the ones scripts/areas.tsv picks for the diff (all of them in the nightly entries), and this runner's share of them (shard k of n)
      - name: ${{ matrix.tier == 'full' && 'Full test tier (make check-full)' || 'Quick test tier (make check, with the leak gate)' }}
        run: make ${{ matrix.tier == 'full' && 'check-full' || 'check' }}
        env:
          SIFT_CI_TMP: ${{ runner.temp }}/sift-ci
          SIFT_CI_AFFECTED: ${{ matrix.jobs }}
          SIFT_CI_SHARD: ${{ matrix.shard }}/${{ matrix.n }}

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pg_sift-test-logs-pg${{ matrix.pg }}-${{ matrix.tier }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/sift-ci/logs
            ${{ runner.temp }}/sift-ci/lane*/**/tap/**/*.log
            ${{ runner.temp }}/sift-ci/lane*/**/postgres.log
            ${{ runner.temp }}/sift-ci/lane*/**/sanitizer
            ${{ runner.temp }}/sift-ci/lane*/**/leakcheck.*
            ${{ runner.temp }}/sift-ci/lane*/regress/*/regression.diffs
            test/regression.diffs
          if-no-files-found: ignore

  # one container per node (primary, standby, subscriber): separate filesystems and installs of the extension
  replication:
    name: Replication in containers (${{ matrix.image }})
    needs: changes
    if: ${{ needs.changes.outputs.replication == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [postgres:17, postgres:18]
    steps:
      - uses: actions/checkout@v6
      - run: PG_IMAGE=${{ matrix.image }} scripts/replication.sh --container

  # the SQLite extension (sqlite/): independent of PostgreSQL, built against the system SQLite development package
  sqlite:
    name: SQLite extension
    needs: changes
    if: ${{ needs.changes.outputs.sqlite == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libsqlite3-dev sqlite3 python3
          sqlite3 --version

      # the portable-core check (the files of src/portable.list include only src/core/sift_host.h), then: build, smoke test, baseline instruction check, 59 unit tests,
      # FTS5 differential on a synthetic corpus, all again with the scalar
      # kernels forced and for the vector-free build; then ASan+UBSan on both test files and the stress test, and TSan on the thread stress
      # test. The tests that need the 218k-article database or a pg_sift run are skipped, with a message, when their variables are unset.
      # vm.mmap_rnd_bits: the runner's address randomization is too wide for TSan's shadow memory.
      - name: Tests (sanitizers included)
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          SIFT_SANITIZE=1 sqlite/test.sh

  # the MariaDB extension (mariadb/): the portable-core check, then the release recipe for two series: build the library in the stock
  # mariadb:<series> image against the headers of its server, and load it into a server of that image (scripts/package-mariadb.sh,
  # mariadb/tests/smoke.sh). The full suite, mariadb/test.sh (218k-article corpus, pg_sift reference, InnoDB FULLTEXT, about 30 minutes
  # on a quiet machine), needs a PostgreSQL and the corpus and is run by hand before a release.
  mariadb:
    name: MariaDB extension (${{ matrix.series }})
    needs: changes
    if: ${{ needs.changes.outputs.mariadb == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        series: ['11.8', '13.0']
    steps:
      - uses: actions/checkout@v6

      - run: scripts/check-portable.sh

      - name: Build and smoke-test the library of the series
        run: SERIES=${{ matrix.series }} scripts/package-mariadb.sh all HEAD dist-mariadb
