name: ci

# Every pull request runs the fast tier: lint, and one PostgreSQL 18 job on x86 with the regression tests its diff can break (scripts/areas.tsv, `scripts/ci.sh affected`)
# and the tests it touches, a few minutes in all; a diff that touches a format directory, the core or the format compatibility tests (`gh:f1`) adds the same job on Format 1.0. A pull request from an `integration/` branch, or one labeled `ci-full` (one at a time: the Actions minutes of a private
# repository are finite), adds the fast tier on PostgreSQL 17, 19 and AArch64, macOS, and the SQLite, MariaDB and replication jobs its diff can break. A push to main or to an
# `integration/` branch runs everything the diff can break, PostgreSQL 17, 18 and 19, the TAP, differential and
# release-library stages and the other jobs; its base is the last green run of that branch, so a red or cancelled push is not forgotten by the next one.
# A dispatch (of main, or of a branch before the merge of a risky change) runs every job of the quick tier ("Full scope" in the first job is
# the mark the release tool looks for); `versions` filters every job, `formats` the formats. Every PostgreSQL 18 job installs pg_repack (PGDG ships 1.5.3) and pg_squeeze (PGDG ships 1.9.4, a few seconds), so test/t/col/pg_repack.sh and test/t/col/pg_squeeze.sh run in the shard that holds them and skip on 17 and 19.
# PostgreSQL 19 (the PGDG packages, like 17 and 18) runs whatever PostgreSQL 17 and 18 run, in the same shards, and fails the run like them.
# Linux on AArch64 (`arm: true` entries, a hosted ubuntu-24.04-arm runner) runs the PostgreSQL 18 entries again: the fast tier of a `ci-full` pull request, the quick tier
# of a push and a dispatch.
# The memory-debugging and sanitizer lanes (assert, valgrind, the ASan+UBSan fuzzers and leak set) are assert.yml, weekly. The long soaks and the 250,000 row plan gates are scripts of their own (scripts/soak.sh,
# scripts/colsoak.sh, scripts/plangate.sh --rows 250000), the exhaustive fault matrix a dispatch with only='^tap-shell-(fault/matrix)$'.
# Two formats, one build: Format 2.0 is what the clusters create (`SIFT_FORMAT=2`, scripts/pgtest.sh), and the shards of Format 1.0 (`format: 1`, `SIFT_FORMAT=1`) install the very archive of the Format 2.0 shards,
# the testing library creates either with sift.test_create_format1, so Format 1.0 costs no compilation. The Format 1.0 run is the plan of the Format 2.0 run less the jobs that format covers (scripts/ci/format1-skip.txt), the proof of the coverage
# table, the plan gates, the differential tests, the isolation, crash and standby tests, the fuzzers and the soaks included. The `formats` input (default `2 1`) picks which of them a dispatch runs.
# The format compatibility tiers (Format 2.0 by default, Format 1 CRUD and online upgrade, the golden v5 cluster through pg_upgrade, the static `format-isolation` check) are jobs of the
# Format 2.0 test shards, picked by the `=compat` group of scripts/areas.tsv: a pull request that changes a format directory runs them in its fast tier, scripts/lint.sh runs the static check, and every push
# and dispatch runs all of them (scripts/ci/jobs.sh, format_checks). sift.test_create_format1 exists only in the testing flavor that the shards install.
# The `musl` job builds the library in postgres:18-alpine (no GNU IFUNC: a library with an IFUNC symbol or an IRELATIVE relocation fails at dlopen) and runs scripts/check-no-ifunc.sh on it and packaging/smoke.sql.
# The `cassert` job is PostgreSQL 18 built with assertions, on the regression tests that run workers (`ASSERT_JOBS` of scripts/ci/affected.sh), for a pull request that
# changes a source that starts workers or handles snapshots (`ASSERT_MARK`) or carries the label `assertions`; a push and a dispatch run the family in two shards on Format 2.0 and two on Format 1.0. It builds its own server and
# needs nothing of the build stage, so it starts with `changes`, and so does `hardened` (the hardened flavor of scripts/hardened.sh on PostgreSQL 18, staged by the job and never by the test shards).
# Build once, test thin: each (PostgreSQL major, architecture) is a call of ci-pg.yml (`pg`), whose build stage compiles the flavors of the entry once (scripts/ci-build.sh: the test library and the release library,
# each on a runner of its own, on every core, through ccache and lld) into one archive each, and whose test shards install them without compiling (a shallow checkout; the compiler, the tag history and the compiler
# caches only where a job of the shard needs them, `scripts/ci.sh --toolchain`, `--history`). The shards of an entry wait for the build of that entry, not for the slowest one of the run.
# A push runs the PostgreSQL 18 x86 entry in four shards of Format 2.0 and three of Format 1.0, and three shards each of the compatibility entries (17, 19, AArch64: `COMPAT_JOBS` of scripts/ci/affected.sh: the regression
# tests, isolation, the crash and standby tests, the corpus and the plan bands; pg_upgrade only on the entry of 19, so that 17 and AArch64 compile and fetch nothing).
# The shards keep their scratch in RAM (/dev/shm) when the runner has the room for it, else on their disk.
# No scheduled run is enabled in this repository: dispatch the workflow to run it.
on:
  push:
    branches: [main, 'integration/**']
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      versions:
        description: 'The PostgreSQL majors of the quick tier, e.g. 18 for a branch with a large diff'
        default: '17 18 19'
      only:
        description: 'A regex on job names, e.g. ^(installcheck|tap-shell)-(col/scope/merge_end|agg/spill_context)$: run only those tests, one job for each major in `versions` and one on arm64 when 18 is in it, and no other job but lint'
        default: ''
      formats:
        description: 'The formats of the quick tier: 2 (the default format of 6.0), 1 (Format 1.0, on the build of the Format 2.0 shards) or both'
        default: '2 1'

permissions:
  contents: read
  actions: read

# the benchmark results stay out of the public repository: its generated pages are checked without the blocks they back
env:
  SIFT_PUBLIC_TREE: ${{ github.event.repository.private == false }}

# a pull request run is cancelled by the next push to the same pull request. A push to main or to an integration branch never cancels the run of the one before it: that run finishes, and of the
# runs waiting behind it GitHub keeps the newest, which scopes its diff from the last green run (see `changes`), so every batch of merges gets one complete run and
# the head of main is tested. A dispatch run has a group of its own, so a push never cancels it (main-verify.yml dispatches one when the head of main has none).
# No dispatch is cancelled by another.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci-full' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `changes` and `lint` start the work and carry the condition; the other jobs skip through `needs`. Any label other than `ci-full` starts a run of its own that skips
# everything, in a group of its own, so it does not cancel the run of the pull request.
jobs:
  changes:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci-full' || github.event.label.name == 'assertions' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
      fast: ${{ steps.scope.outputs.fast }}
      fastjobs: ${{ steps.scope.outputs.fastjobs }}
      sqlite: ${{ steps.scope.outputs.sqlite }}
      mariadb: ${{ steps.scope.outputs.mariadb }}
      replication: ${{ steps.scope.outputs.replication }}
      macos: ${{ steps.scope.outputs.macos }}
      formula: ${{ steps.scope.outputs.formula }}
      musl: ${{ steps.scope.outputs.musl }}
      hardened: ${{ steps.scope.outputs.hardened }}
      pg: ${{ steps.matrix.outputs.pg }}
      cassert: ${{ steps.matrix.outputs.cassert }}
    steps:
      # a pull request is checked out as the merge of its head into the base: its first parent is the base the diff is taken from, so two commits are all it needs. A push compares with the
      # last green run of the branch, which can be any ancestor
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          CIPR: ${{ startsWith(github.head_ref, 'integration/') || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
          ONLY: ${{ inputs.only }}
        run: |
          base=all
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push)
              # the newest green run of main whose commit is an ancestor of this one: what it checked is not checked again
              for sha in $(gh run list --workflow ci.yml --branch "$GITHUB_REF_NAME" --status success --limit 20 --json headSha --jq '.[].headSha'); do
                git merge-base --is-ancestor "$sha" HEAD 2>/dev/null && { base=$sha; break; }
              done ;;
          esac
          echo "base: $base"
          scripts/ci.sh affected --list "$base" | tee -a "$GITHUB_STEP_SUMMARY"
          # a pull request that is neither from an integration branch nor labeled `ci-full` runs the fast tier on x86 and the assertions family (below), not the other platforms
          if { [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$CIPR" != true ]; } || [ -n "$ONLY" ]; then
            scripts/ci.sh affected --github "$base" | grep -vE '^(sqlite|mariadb|replication|macos)=' | tee -a "$GITHUB_OUTPUT"
          else
            scripts/ci.sh affected --github "$base" | tee -a "$GITHUB_OUTPUT"
          fi

      # the mark of a run that covered everything (the release tool reads it from the API)
      - name: Full scope
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: echo "every job of the quick tier ran"

      - id: matrix
        env:
          NSHARDS: ${{ steps.scope.outputs.nshards }}
          PG: ${{ steps.scope.outputs.pg }}
          JOBS: ${{ steps.scope.outputs.jobs }}
          FAST: ${{ steps.scope.outputs.fast }}
          FASTJOBS: ${{ steps.scope.outputs.fastjobs }}
          FASTPG: ${{ steps.scope.outputs.fastpg }}
          F1: ${{ steps.scope.outputs.f1 }}
          VERSIONS: ${{ inputs.versions }}
          FORMATS: ${{ inputs.formats }}
          ONLY: ${{ inputs.only }}
          EVENT: ${{ github.event_name }}
          CIPR: ${{ startsWith(github.head_ref, 'integration/') || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
          CASSERT: ${{ steps.scope.outputs.cassert }}
          CASSERTJOBS: ${{ steps.scope.outputs.cassertjobs }}
          COMPAT: ${{ steps.scope.outputs.compat }}
          COMPAT17: ${{ steps.scope.outputs.compat17 }}
          COMPATARM: ${{ steps.scope.outputs.compatarm }}
          LABEL_ASSERTIONS: ${{ contains(github.event.pull_request.labels.*.name, 'assertions') }}
        run: |
          # The entries of `postgresql` (`tests`) and of `cassert`, one per runner. A pull request: one PostgreSQL 18 job, the regression tests of the areas the diff touches (`jobs`, narrower than the push's: scripts/areas.tsv
          # `fast:` rows) and the tests it touches (`only`, SIFT_CI_JOBS), and the same on Format 1.0 when the diff touches a format (`f1`). A push: PostgreSQL 18 in four shards of Format 2.0 and three of Format 1.0
          # (the jobs of 17 that install a library flavor run one after the other, apart from the pool, scripts/ci.sh, and the 4 cores of a hosted x86 runner take 16 to 18 minutes for a third of the 18 quick tier,
          # hosted run 42152410447), three shards of each compatibility entry (17, 19, AArch64: 511 to 520 jobs, two shards ran into the limit of 40 minutes), and the assertions family in two shards of each
          # format (one shard of Format 1.0, 404 jobs, ran into it in every push). Format 1.0 installs the build of Format 2.0
          set -o pipefail   # a jq error must fail the step: an empty matrix skips every test job and the gate passes
          m=$(jq -nc --arg compat "$COMPAT" --arg compat17 "$COMPAT17" --arg compatarm "$COMPATARM" --argjson n "${NSHARDS:-1}" --arg cipr "$CIPR" --arg cassert "$CASSERT" --arg cassertjobs "$CASSERTJOBS" --arg label "$LABEL_ASSERTIONS" --arg pg "$PG" --arg fastpg "$FASTPG" --arg f1 "${F1:-false}" --arg jobs "$JOBS" --arg fast "$FAST" --arg fastjobs "$FASTJOBS" --arg event "$EVENT" --arg versions "$VERSIONS" --arg formats "${FORMATS:-2 1}" --arg only "$ONLY" '
            def runs($pgs; $m; $rest): [range(1; $m + 1) as $s | ({pg: $pgs, shard: $s, n: $m, tier: "quick"} + $rest)];
            (if $only != "" then
              {tests: ([($versions | split(" ")[] | tonumber) as $v | {pg: $v, shard: 1, n: 1, tier: "fast", jobs: ".", only: $only, format: 2, long: true}] + [{pg: 18, arm: true, shard: 1, n: 1, tier: "fast", jobs: ".", only: $only, format: 2, long: true}]), cassert: []}
            elif $event == "pull_request" then
              {tests: ((if $fastpg == "true" then ([{pg: 18, arm: false}] + (if $cipr == "true" then [{pg: 18, arm: true}, {pg: 17}, {pg: 19}] else [] end)) | map({shard: 1, n: 1, tier: "fast", jobs: $fastjobs, only: $fast, format: 2} + .) else [] end)
                + (if $fastpg == "true" and $f1 == "true" then [{pg: 18, shard: 1, n: 1, tier: "fast", jobs: $fastjobs, only: $fast, format: 1}] else [] end)),
               cassert: (if $cassert == "true" or $label == "true" then [{pg: 18, shard: 1, n: 1, tier: "quick", jobs: $cassertjobs, format: 2}] else [] end)}
            else
              {tests: (if $pg == "true" then
                    runs(18; (if $n > 1 then $n + 1 else $n end); {jobs: $jobs, format: 2})
                    + (if $f1 == "true" then runs(18; (if $n > 1 then 3 else 1 end); {jobs: $jobs, format: 1}) else [] end)
                    + runs(17; 3; {jobs: $jobs, only: $compat17, format: 2})
                    + runs(19; 3; {jobs: $jobs, only: $compat, format: 2})
                    + runs(18; 3; {jobs: $jobs, only: $compatarm, arm: true, format: 2}) else [] end),
               cassert: (if $pg == "true" then runs(18; 2; {jobs: $cassertjobs, format: 2}) + (if $f1 == "true" then runs(18; 2; {jobs: $cassertjobs, format: 1}) else [] end) else [] end)}
            end)
            | def keep: select(($versions == "" or ((.pg | tostring) as $p | ($versions | split(" ") | index($p)) != null)) and ((.format | tostring) as $f | ($formats | split(" ") | index($f)) != null));
            .tests |= (map(keep) | map(. + {bin: ("pg\(.pg)-\(if .arm then "arm64" else "x86_64" end)")}))
            | .cassert |= map(keep)')
          echo "matrix=$(jq -c .tests <<<"$m")" | tee -a "$GITHUB_OUTPUT"
          echo "cassert=$(jq -c .cassert <<<"$m")" | tee -a "$GITHUB_OUTPUT"
          # the calls of ci-pg.yml: one for each staged build the entries above install (Format 1.0 shares the build of Format 2.0; the hardened flavor is staged by its job), with its test entries and
          # the legs of its build stage: the test library, and for the quick tier the release library (with the 8-page flavour of scripts/scaling-gate.sh on 18 and later, which has the room beside it)
          jq -c '"pg=" + ([.tests | group_by(.bin)[] | {pg: .[0].pg, arm: (.[0].arm // false), bin: .[0].bin, tests: .,
              builds: ([{name: "testing", flavors: "testing"}] + (if any(.tier == "quick") then [{name: "release", flavors: (if .[0].pg >= 18 then "release sb8" else "release" end)}] else [] end))}] | tojson)' -r <<<"$m" | tee -a "$GITHUB_OUTPUT"

  # no PostgreSQL: the syntax of every script, the portable core, the map of areas against the tests, the workflows
  lint:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci-full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # the python3 of macOS is 3.9: the scripts and generators lint runs must work on it
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - run: scripts/lint.sh
      - name: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 && ./actionlint

  # each (PostgreSQL major, architecture): its build stage and its test shards (ci-pg.yml)
  pg:
    name: ${{ matrix.bin }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.pg != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.pg) }}
    uses: ./.github/workflows/ci-pg.yml
    with:
      pg: ${{ matrix.pg }}
      arm: ${{ matrix.arm }}
      bin: ${{ matrix.bin }}
      builds: ${{ toJSON(matrix.builds) }}
      tests: ${{ toJSON(matrix.tests) }}

  # PostgreSQL 18 built from source with assertions (the planner asserts of the server, a foreach_node cast of the wrong node type, exist only in a build with --enable-cassert, which the distribution packages lack:
  # scripts/pg-assert.sh, cached with the build of assert.yml), pg_sift built against it, and the regression tests that run workers or plan. It installs no staged flavor and
  # waits for nothing but `changes`: it is the longest job of a push and starts with the first. The server is built by the job (PGDG is not asked for), the library through ccache and lld.
  cassert:
    name: PostgreSQL 18 (assertions)${{ matrix.format == 1 && ' Format 1' || '' }}${{ matrix.n > 1 && format(' ({0}/{1})', matrix.shard, matrix.n) || '' }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.cassert != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.cassert) }}
    env:
      SIFT_CI_AFFECTED: ${{ matrix.jobs }}
      SIFT_CI_SHARD: ${{ matrix.shard }}/${{ matrix.n }}
      SIFT_CI_PG_MAJOR: ${{ matrix.pg }}
      SIFT_CI_ASSERT: 1
      SIFT_CI_NO_HARNESS: 1
      SIFT_CI_STATS: 1
      SIFT_FORMAT: ${{ matrix.format }}
      PG_LDFLAGS: -fuse-ld=lld
      CI_BUDGET_MB: 3600
      CI_MAX_MB: 5120
    steps:
      - uses: actions/checkout@v6

      - name: Scratch directory
        run: |
          dir=$RUNNER_TEMP/sift-ci
          if [ "$(df -Pm /dev/shm 2>/dev/null | awk 'NR == 2 { print $4 }')" -ge 6000 ] 2>/dev/null; then dir=/dev/shm/sift-ci; fi
          echo "SIFT_CI_TMP=$dir" >> "$GITHUB_ENV"

      - uses: ./.github/actions/apt-limits

      - id: week
        run: |
          echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "APT_ARCHIVES=$HOME/apt-debs" >> "$GITHUB_ENV"

      - name: Cache the apt packages
        uses: actions/cache@v5
        with:
          path: ~/apt-debs
          key: apt-pg${{ matrix.pg }}-assert-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}
          restore-keys: |
            apt-pg${{ matrix.pg }}-assert-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the build dependencies
        timeout-minutes: 10
        run: |
          scripts/apt-install.sh bison flex libipc-run-perl liblz4-dev libzstd-dev libicu-dev ccache lld
          echo /usr/lib/ccache >> "$GITHUB_PATH"

      # the server is saved as soon as it is built: a cache saved at the end of the job was never saved, the shards fail or reach their limit and the server was built again by every shard of every
      # run. An older cache is restored too: scripts/pg-assert.sh rebuilds only when the recipe it records differs (a change to its comments builds nothing)
      - name: Cache PostgreSQL ${{ matrix.pg }} with assertions
        id: pg-assert
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/sift/pg
          key: pg-assert-${{ matrix.pg }}-${{ hashFiles('scripts/pg-assert.sh') }}
          restore-keys: |
            pg-assert-${{ matrix.pg }}-

      - name: Build PostgreSQL ${{ matrix.pg }} with assertions
        run: |
          prefix=$(PG_ASSERT_MAJOR=${{ matrix.pg }} scripts/pg-assert.sh)
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Keep PostgreSQL ${{ matrix.pg }} with assertions
        if: ${{ steps.pg-assert.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/sift/pg
          key: ${{ steps.pg-assert.outputs.cache-primary-key }}

      # the compiler cache of pg_sift against this server: the objects of the testing library are the ones of every other job, the cache is kept by the first shard that ends, passed or not
      - name: Cache the compiler
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ccache-cassert-pg${{ matrix.pg }}-${{ runner.arch }}-${{ hashFiles('src/**', 'Makefile', 'scripts/pg-assert.sh') }}
          restore-keys: |
            ccache-cassert-pg${{ matrix.pg }}-${{ runner.arch }}-

      - name: Quick test tier on the server with assertions (make check, with the leak gate)
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 1
          CCACHE_COMPRESS: 1
          CCACHE_COMPRESSLEVEL: 1
          CCACHE_SLOPPINESS: time_macros,include_file_mtime
          CCACHE_MAXSIZE: 1G
        run: make check

      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: ccache -s

      - name: Keep the compiler cache
        if: ${{ !cancelled() && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Keep the logs of a failed run
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: pg_sift-test-logs-pg${{ matrix.pg }}-cassert-f${{ matrix.format }}-${{ matrix.shard }}
          path: |
            ${{ env.SIFT_CI_TMP }}/logs
            ${{ env.SIFT_CI_TMP }}/lane*/**/tap/**/*.log
            ${{ env.SIFT_CI_TMP }}/lane*/**/postgres.log
            ${{ env.SIFT_CI_TMP }}/lane*/**/leakcheck.*
            ${{ env.SIFT_CI_TMP }}/lane*/regress/*/regression.diffs
            ${{ env.SIFT_CI_TMP }}/lane*/regress/*.report
            test/regression.diffs
          if-no-files-found: ignore

  # the hardened flavor (docs/ARCHITECTURE.md: stack protector, FORTIFY_SOURCE=3, zero-initialized locals, trap-mode UBSan) of PostgreSQL 18 on x86, staged by the job (scripts/ci-build.sh: a tree at a path of
  # its own, a compiler cache keyed by content, lld) and tested on the decoders and readers of stored bytes (scripts/hardened.sh --quick: six tests; the whole list runs by hand).
  # It has a job of its own so that no test shard waits for its build, and starts with `changes`
  hardened:
    name: Hardened build (PostgreSQL 18)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.hardened == 'true' && github.event_name != 'pull_request' && inputs.only == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/apt-limits

      - id: week
        run: |
          echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "APT_ARCHIVES=$HOME/apt-debs" >> "$GITHUB_ENV"

      - name: Cache the apt packages
        uses: actions/cache@v5
        with:
          path: ~/apt-debs
          key: apt-pg18-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}
          restore-keys: |
            apt-pg18-${{ runner.os }}-${{ runner.arch }}-

      - name: PGDG repository
        timeout-minutes: 5
        run: scripts/pgdg-repo.sh

      - name: Install PostgreSQL 18
        timeout-minutes: 10
        run: |
          scripts/apt-install.sh postgresql-18 postgresql-server-dev-18 liblz4-dev libzstd-dev libicu-dev ccache lld
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Cache the compiler
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ccache-hardened-pg18-${{ runner.arch }}-${{ hashFiles('src/**', 'Makefile', 'scripts/harden.mk') }}
          restore-keys: |
            ccache-hardened-pg18-${{ runner.arch }}-

      - name: Stage the hardened flavor
        env:
          SIFT_SRC_DIR: ${{ runner.temp }}/sift-src
        run: scripts/ci-build.sh "$RUNNER_TEMP/bin" hardened

      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: ccache -s

      - name: Keep the compiler cache
        if: ${{ !cancelled() && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Hardened regression tests
        env:
          SIFT_TMP: ${{ runner.temp }}/sift-hardened
          SIFT_PREBUILT_HARDENED: ${{ runner.temp }}/bin/root-hardened
        run: scripts/hardened.sh --quick

  # one container per node (primary, standby, subscriber): separate filesystems and installs of the extension
  replication:
    name: Replication in containers (${{ matrix.image }})
    needs: changes
    if: ${{ needs.changes.outputs.replication == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [postgres:17, postgres:18]
    steps:
      - uses: actions/checkout@v6
      - run: PG_IMAGE=${{ matrix.image }} scripts/replication.sh --container

  # the SQLite extension (sqlite/): independent of PostgreSQL, built against the system SQLite development package
  sqlite:
    name: SQLite extension
    needs: changes
    if: ${{ needs.changes.outputs.sqlite == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/apt-limits

      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          scripts/apt-install.sh --update build-essential libsqlite3-dev sqlite3 python3
          sqlite3 --version

      # the portable-core check (the files of src/portable.list include only src/core/host.h), then: build, smoke test, baseline instruction check, 59 unit tests,
      # FTS5 differential on a synthetic corpus, all again with the scalar
      # kernels forced and for the vector-free build; then ASan+UBSan on both test files and the stress test, and TSan on the thread stress
      # test. The tests that need the 218k-article database or a pg_sift run are skipped, with a message, when their variables are unset.
      # vm.mmap_rnd_bits: the runner's address randomization is too wide for TSan's shadow memory.
      - name: Tests (sanitizers included)
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          SIFT_SANITIZE=1 sqlite/test.sh

  # the MariaDB extension (mariadb/): the portable-core check, then the release recipe for two series: build the library in the stock
  # mariadb:<series> image against the headers of its server, and load it into a server of that image (scripts/package-mariadb.sh,
  # mariadb/tests/smoke.sh). The full suite, mariadb/test.sh (218k-article corpus, pg_sift reference, InnoDB FULLTEXT, about 30 minutes
  # on a quiet machine), needs a PostgreSQL and the corpus and is run by hand before a release.
  mariadb:
    name: MariaDB extension (${{ matrix.series }})
    needs: changes
    if: ${{ needs.changes.outputs.mariadb == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        series: ['11.8', '13.0']
    steps:
      - uses: actions/checkout@v6

      - run: scripts/check-portable.sh

      - name: Build and smoke-test the library of the series
        run: SERIES=${{ matrix.series }} scripts/package-mariadb.sh all HEAD dist-mariadb

  # musl (Alpine) has no GNU IFUNC: the library built on postgres:18-alpine has no IFUNC symbol and no IRELATIVE relocation, loads in that server, and passes the smoke test.
  # It runs where scripts/areas.tsv says (gh:musl: the build, src/core/ and packaging/docker/, so also a dispatch)
  musl:
    name: Alpine musl (no IFUNC)
    needs: changes
    if: ${{ needs.changes.outputs.musl == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build, check for IFUNC and smoke test on musl
        run: docker run --rm -v "$PWD:/src:ro" postgres:18-alpine sh /src/scripts/musl-check.sh

  # Homebrew on macOS arm64, the one place that is not Linux: the formula of this checkout builds and passes its own test on PostgreSQL 17 and 18 (Homebrew has no postgresql@19 formula yet), and the
  # test harness runs on brew's bash 5 (a few regression tests and the TAP tests that failed on the BSD tools; the stages that need GNU tools or /proc stay on Linux) while `make check` under the stock
  # /bin/bash 3.2 must stop with a message instead of exiting 0. It runs where scripts/areas.tsv says (gh:macos: the build, the harness and Formula/ are
  # `.`, so a core or harness change and a dispatch), never on a pull request that touches only sources or docs. Hosted macOS minutes are
  # free for a public repository (10x the Linux rate for a private one), hence the time limit.
  macos:
    name: macOS arm64 (Homebrew)
    needs: changes
    if: ${{ needs.changes.outputs.macos == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
      CCACHE_NOHASHDIR: 1
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 1
      CCACHE_SLOPPINESS: time_macros,include_file_mtime
      CCACHE_MAXSIZE: 1G
    steps:
      # the whole history and the tags: the tests that build an older release (git archive of v3.2.x) skip without them
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install bash 5 and PostgreSQL 17 and 18
        run: |
          brew install bash postgresql@17 postgresql@18 lz4 zstd coreutils ccache
          mkdir -p "$RUNNER_TEMP/gnu-timeout"
          ln -s "$(brew --prefix coreutils)/bin/gtimeout" "$RUNNER_TEMP/gnu-timeout/timeout"

      # the compiler cache of the test builds below (PostgreSQL 18 and 17 compile the same objects): the key is the sources, the newest cache of the branch or of main is restored
      - name: Directory of the compiler cache
        run: echo "CCACHE_DIR=$HOME/.ccache-sift" >> "$GITHUB_ENV"

      - name: Cache the compiler
        uses: actions/cache@v5
        with:
          path: ~/.ccache-sift
          key: ccache-macos-${{ hashFiles('src/**', 'Makefile') }}
          restore-keys: |
            ccache-macos-

      # the README install (a tap, brew install, brew test) on this checkout: the formula is copied into a tap of its own, in the runner's prefix. The stable formula is
      # installed from the real archive of its tag (the url and sha256 of the file are what a user gets) only when the diff changes Formula/pg_sift.rb: the compile of an archive that is not
      # the tree under test checks nothing else. The HEAD one is installed from this checkout every time; style and audit read the formula as it is in the file
      - name: Formula (brew style, brew audit, brew install, brew test)
        env:
          FORMULA_CHANGED: ${{ needs.changes.outputs.formula }}
        run: |
          git branch -f macos-ci HEAD
          brew tap-new --no-git local/ci
          # Homebrew refuses to load a formula from a tap it was not told to trust (brew audit and brew install fail with "untrusted tap")
          brew trust local/ci
          mkdir -p "$(brew --repository local/ci)/Formula"
          cp Formula/pg_sift.rb "$(brew --repository local/ci)/Formula/pg_sift.rb"
          brew style local/ci/pg_sift
          brew audit --strict --online local/ci/pg_sift
          if [ "$FORMULA_CHANGED" = true ]; then
            brew install local/ci/pg_sift
            brew test local/ci/pg_sift
            brew uninstall local/ci/pg_sift
          fi
          sed "s|^  head .*|  head \"file://$PWD\", using: :git, branch: \"macos-ci\"|" Formula/pg_sift.rb >"$(brew --repository local/ci)/Formula/pg_sift.rb"
          brew install --HEAD local/ci/pg_sift
          brew test local/ci/pg_sift

      # the report this job answers: no brew bash on PATH, so `env bash` is /bin/bash 3.2
      - name: make check under the stock bash 3.2 fails with a message
        run: |
          /bin/bash --version | head -1
          if out=$(env PATH=/usr/bin:/bin:/usr/sbin:/sbin PG_CONFIG="$(brew --prefix postgresql@18)/bin/pg_config" make check 2>&1); then
            echo "$out"; echo "make check exited 0 under bash 3.2"; exit 1
          fi
          echo "$out"
          grep -q 'needs bash 4+' <<<"$out"

      # the BSD tools and the clang of macOS: the portability reports of `make check` were these (paste, stat, wc, seq, the module suffix). The checks that give the same answer on every system run in the
      # `lint` job of Linux (scripts/lint.sh --macos is the subset that does not)
      - name: lint (--macos)
        run: |
          PATH="$(brew --prefix)/bin:$(brew --prefix postgresql@18)/bin:$PATH"; export PATH
          scripts/lint.sh --macos

      # the formula above leaves its pg_sift in the server's directories, as a user's install does: the upgrade tests must use their own
      - name: make check (regression tests, the tests that tripped on macOS) under brew bash 5
        env:
          SIFT_CI_TMP: /tmp/sc18
          SIFT_CI_JOBS: '^(installcheck-(agg/star_jsonb_unnest|bm25/facets|bm25/filter/pushdown|col/f2/am|table/f2/parity)|tap-shell-(col/auto_merge/concurrent|col/refresh_crash|col/wbuf/batch|compat/pg_upgrade/basic|compat/pg_upgrade/v32|core/leakcheck_gate|core/scaling_slope|table/replica_mixed))$'
          SIFT_CI_NO_HARNESS: 1
        run: |
          PATH="$(brew --prefix ccache)/libexec:$RUNNER_TEMP/gnu-timeout:$(brew --prefix)/bin:$(brew --prefix postgresql@18)/bin:$PATH"; export PATH
          bash --version | head -1
          make check

      # PostgreSQL 17 has no extension_control_path: sift is installed into the server's own directories (the runner is throwaway). replica_mixed and
      # scaling_slope need PostgreSQL 18 and skip themselves, and the older releases are not built on 17 either (scripts/old-lib-check.sh)
      - name: make check (the same tests) on PostgreSQL 17
        env:
          SIFT_CI_TMP: /tmp/sc17
          SIFT_CI_JOBS: '^(installcheck-(agg/star_jsonb_unnest|bm25/facets|bm25/filter/pushdown|col/f2/am|table/f2/parity)|tap-shell-(col/auto_merge/concurrent|col/refresh_crash|col/wbuf/batch|compat/pg_upgrade/basic|compat/pg_upgrade/v32|core/leakcheck_gate|core/scaling_slope|table/replica_mixed))$'
          SIFT_CI_NO_HARNESS: 1
        run: |
          PATH="$(brew --prefix ccache)/libexec:$RUNNER_TEMP/gnu-timeout:$(brew --prefix)/bin:$(brew --prefix postgresql@17)/bin:$PATH"; export PATH
          make check

      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: ccache -s

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pg_sift-test-logs-macos
          path: |
            /tmp/sc1*/logs
            /tmp/sc1*/lane*/**/postgres.log
            /tmp/sc1*/lane*/regress/*/regression.diffs
          if-no-files-found: ignore

  # the one name for a branch ruleset to require: the shard names of the jobs above change with the diff and the event, this one does not.
  # A job that did not run (skipped) passes; a failed or cancelled one fails the gate
  gate:
    needs: [changes, lint, pg, cassert, hardened, replication, sqlite, mariadb, macos, musl]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: '! ${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}'
