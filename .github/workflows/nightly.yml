name: nightly

# The deep gate as a run of its own: the full tier of ci.yml at its long sizes, on a build of the ASan+UBSan flavor made once for each major (scripts/ci-build.sh) and shared by
# its shards: the sanitizer build of the server library, the long soaks (180 to 600 s), the exhaustive fault matrices, the 250,000 row ranking of the plan gate, the 8-page scaling
# slope, the fuzzers and the differential tests at their long seeds and sizes, and the analyzers. The pull request and push runs (ci.yml) carry none of them.
# No scheduled run is enabled in this repository (the Actions minutes of a private repository are finite): dispatch the workflow, or add a schedule here to turn the nightly run on.
on:
  workflow_dispatch:
    inputs:
      deep:
        description: The sizes of the nightly run; without it the lean full tier (a job fits 45 minutes and the run 75)
        type: boolean
        default: true
      full_pg:
        description: 'The PostgreSQL majors of the full tier, e.g. 18 for one run of its own'
        default: '17 18'
      only:
        description: 'A regex on job names: run only those jobs of the full tier'
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  deep:
    uses: ./.github/workflows/ci.yml
    with:
      heavy: true
      deep: ${{ inputs.deep }}
      versions: '17 18 19'
      full_pg: ${{ inputs.full_pg }}
      only: ${{ inputs.only }}
