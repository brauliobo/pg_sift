<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="786" viewBox="0 0 1000 786" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Growth with the number of orders</title>
<desc id="d">Median growth of the time per question from 25,000 to 10,000,000 orders, per system, with the log-log slope.</desc>
<rect x="0.5" y="0.5" width="999" height="785" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="20" y="32" font-size="18" text-anchor="start" fill="#e6edf3" font-weight="bold">Growth with the number of orders: 25,000 to 10,000,000 (400x)</text>
<text x="20" y="54" font-size="13" text-anchor="start" fill="#9198a1">For each system, the median over the questions of the time at n rows divided by the time at 25,000 rows, on logarithmic axes. The</text>
<text x="20" y="72" font-size="13" text-anchor="start" fill="#9198a1">dashed line is time proportional to the rows (slope 1); below it a system grows slower than its data.</text>
<line x1="80" y1="596.6" x2="810" y2="596.6" stroke="#262c34" stroke-width="1"/>
<text x="72" y="600.6" font-size="12" text-anchor="end" fill="#9198a1">1×</text>
<line x1="80" y1="439.1" x2="810" y2="439.1" stroke="#262c34" stroke-width="1"/>
<text x="72" y="443.1" font-size="12" text-anchor="end" fill="#9198a1">10×</text>
<line x1="80" y1="281.5" x2="810" y2="281.5" stroke="#262c34" stroke-width="1"/>
<text x="72" y="285.5" font-size="12" text-anchor="end" fill="#9198a1">100×</text>
<line x1="80" y1="124" x2="810" y2="124" stroke="#262c34" stroke-width="1"/>
<text x="72" y="128" font-size="12" text-anchor="end" fill="#9198a1">1,000×</text>
<line x1="80" y1="124" x2="80" y2="644" stroke="#262c34" stroke-width="1"/>
<text x="80" y="664" font-size="13" text-anchor="middle" fill="#9198a1">25k</text>
<line x1="248.9" y1="124" x2="248.9" y2="644" stroke="#262c34" stroke-width="1"/>
<text x="248.9" y="664" font-size="13" text-anchor="middle" fill="#9198a1">100k</text>
<line x1="529.5" y1="124" x2="529.5" y2="644" stroke="#262c34" stroke-width="1"/>
<text x="529.5" y="664" font-size="13" text-anchor="middle" fill="#9198a1">1M</text>
<line x1="810" y1="124" x2="810" y2="644" stroke="#262c34" stroke-width="1"/>
<text x="810" y="664" font-size="13" text-anchor="middle" fill="#9198a1">10M</text>
<text x="445" y="686" font-size="12" text-anchor="middle" fill="#9198a1">orders in the table</text>
<line x1="80" y1="596.6" x2="810" y2="186.7" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="606.1" y="166.7" width="200.9" height="17" fill="#0d1117" rx="3"/>
<text x="804" y="178.7" font-size="12" text-anchor="end" fill="#9198a1">time proportional to the rows</text>
<polyline fill="none" stroke="#8b949e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="80,596.6 248.9,539.5 529.5,411.4 810,242.4"/>
<rect x="75" y="591.6" width="10" height="10" fill="#8b949e" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>PostgreSQL: 1.0× the time of 25,000 rows at 25k</title></rect>
<rect x="243.9" y="534.5" width="10" height="10" fill="#8b949e" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>PostgreSQL: 2.3× the time of 25,000 rows at 100k</title></rect>
<rect x="524.5" y="406.4" width="10" height="10" fill="#8b949e" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>PostgreSQL: 15.0× the time of 25,000 rows at 1M</title></rect>
<rect x="805" y="237.4" width="10" height="10" fill="#8b949e" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>PostgreSQL: 177.2× the time of 25,000 rows at 10M</title></rect>
<polyline fill="none" stroke="#3987e5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="80,596.6 248.9,578.2 529.5,575.9 810,457.5"/>
<circle cx="80" cy="596.6" r="5" fill="#3987e5" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>pg_sift sift_col: 1.0× the time of 25,000 rows at 25k</title></circle>
<circle cx="248.9" cy="578.2" r="5" fill="#3987e5" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>pg_sift sift_col: 1.3× the time of 25,000 rows at 100k</title></circle>
<circle cx="529.5" cy="575.9" r="5" fill="#3987e5" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>pg_sift sift_col: 1.4× the time of 25,000 rows at 1M</title></circle>
<circle cx="810" cy="457.5" r="5" fill="#3987e5" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>pg_sift sift_col: 7.6× the time of 25,000 rows at 10M</title></circle>
<polyline fill="none" stroke="#199e70" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="80,596.6 248.9,562.9 529.5,542.6 810,376.4"/>
<polygon points="80,590.1 86.5,596.6 80,603.1 73.5,596.6" fill="#199e70" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>pg_sift sift_table: 1.0× the time of 25,000 rows at 25k</title></polygon>
<polygon points="248.9,556.4 255.4,562.9 248.9,569.4 242.4,562.9" fill="#199e70" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>pg_sift sift_table: 1.6× the time of 25,000 rows at 100k</title></polygon>
<polygon points="529.5,536.1 536,542.6 529.5,549.1 523,542.6" fill="#199e70" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>pg_sift sift_table: 2.2× the time of 25,000 rows at 1M</title></polygon>
<polygon points="810,369.9 816.5,376.4 810,382.9 803.5,376.4" fill="#199e70" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>pg_sift sift_table: 25.0× the time of 25,000 rows at 10M</title></polygon>
<polyline fill="none" stroke="#9085e9" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="80,596.6 248.9,586.5 529.5,559.1 810,560.6"/>
<polygon points="80,590.6 86,601.6 74,601.6" fill="#9085e9" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>Elasticsearch: 1.0× the time of 25,000 rows at 25k</title></polygon>
<polygon points="248.9,580.5 254.9,591.5 242.9,591.5" fill="#9085e9" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>Elasticsearch: 1.2× the time of 25,000 rows at 100k</title></polygon>
<polygon points="529.5,553.1 535.5,564.1 523.5,564.1" fill="#9085e9" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>Elasticsearch: 1.7× the time of 25,000 rows at 1M</title></polygon>
<polygon points="810,554.6 816,565.6 804,565.6" fill="#9085e9" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>Elasticsearch: 1.7× the time of 25,000 rows at 10M</title></polygon>
<polyline fill="none" stroke="#c98500" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="80,596.6 248.9,586.3 529.5,557.6 810,507.8"/>
<polygon points="80,602.6 86,591.6 74,591.6" fill="#c98500" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>ClickHouse: 1.0× the time of 25,000 rows at 25k</title></polygon>
<polygon points="248.9,592.3 254.9,581.3 242.9,581.3" fill="#c98500" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>ClickHouse: 1.2× the time of 25,000 rows at 100k</title></polygon>
<polygon points="529.5,563.6 535.5,552.6 523.5,552.6" fill="#c98500" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>ClickHouse: 1.8× the time of 25,000 rows at 1M</title></polygon>
<polygon points="810,513.8 816,502.8 804,502.8" fill="#c98500" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>ClickHouse: 3.7× the time of 25,000 rows at 10M</title></polygon>
<polyline fill="none" stroke="#d55181" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="80,596.6 248.9,513.2 529.5,360.6 810,203.7"/>
<g stroke="#d55181" stroke-width="2.5" stroke-linecap="round"><title>Citus columnar: 1.0× the time of 25,000 rows at 25k</title><line x1="75.5" y1="592.1" x2="84.5" y2="601.1"/><line x1="75.5" y1="601.1" x2="84.5" y2="592.1"/></g>
<g stroke="#d55181" stroke-width="2.5" stroke-linecap="round"><title>Citus columnar: 3.4× the time of 25,000 rows at 100k</title><line x1="244.4" y1="508.7" x2="253.4" y2="517.7"/><line x1="244.4" y1="517.7" x2="253.4" y2="508.7"/></g>
<g stroke="#d55181" stroke-width="2.5" stroke-linecap="round"><title>Citus columnar: 31.5× the time of 25,000 rows at 1M</title><line x1="525" y1="356.1" x2="534" y2="365.1"/><line x1="525" y1="365.1" x2="534" y2="356.1"/></g>
<g stroke="#d55181" stroke-width="2.5" stroke-linecap="round"><title>Citus columnar: 312.1× the time of 25,000 rows at 10M</title><line x1="805.5" y1="199.2" x2="814.5" y2="208.2"/><line x1="805.5" y1="208.2" x2="814.5" y2="199.2"/></g>
<text x="824" y="207.7" font-size="13" text-anchor="start" fill="#e6edf3" font-weight="bold">Citus  slope 0.96</text>
<text x="824" y="246.4" font-size="13" text-anchor="start" fill="#e6edf3" font-weight="bold">PostgreSQL  slope 0.87</text>
<text x="824" y="380.4" font-size="13" text-anchor="start" fill="#e6edf3" font-weight="bold">sift_table  slope 0.50</text>
<text x="824" y="461.5" font-size="13" text-anchor="start" fill="#e6edf3" font-weight="bold">sift_col  slope 0.31</text>
<text x="824" y="511.8" font-size="13" text-anchor="start" fill="#e6edf3" font-weight="bold">ClickHouse  slope 0.22</text>
<text x="824" y="564.6" font-size="13" text-anchor="start" fill="#e6edf3" font-weight="bold">Elasticsearch  slope 0.10</text>
<text x="20" y="710" font-size="12" text-anchor="start" fill="#9198a1">Data: docs/results/store-scaling.json and store.json (3 CPUs per server, warm medians of 7 aggregate questions at each size), AMD Ryzen 7</text>
<text x="20" y="727" font-size="12" text-anchor="start" fill="#9198a1">9700X, 16 threads. The slope is the least-squares slope of log time on log rows over the four sizes.</text>
<text x="20" y="744" font-size="12" text-anchor="start" fill="#9198a1">Questions that finish in a millisecond are dominated by fixed costs at the small sizes, which is why a slope below 1 is expected there; the</text>
<text x="20" y="761" font-size="12" text-anchor="start" fill="#9198a1">per-question panels follow.</text>
</svg>
