<text x="20" y="454" font-size="11" text-anchor="start" fill="#57606a">Elasticsearch: bulk load and refresh; its force-merge to one segment is not in the build time.</text>
<text x="20" y="436" font-size="11" text-anchor="start" fill="#57606a">places: pgx-bm25 also stores two generated columns, the table grows (docs/BENCHMARKS.md).</text>
<text x="20" y="418" font-size="11" text-anchor="start" fill="#57606a">places: pg_textsearch and rum show the native index; their emulated workloads add indexes (docs/BENCHMARKS.md).</text>
<text x="20" y="472" font-size="11" text-anchor="start" fill="#57606a">Slim tier, one build per engine; AMD Ryzen 7 9700X, 16 threads (load avg 6-9); Oct 2026.</text>
