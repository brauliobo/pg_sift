<svg xmlns="http://www.w3.org/2000/svg" width="880" height="414" viewBox="0 0 880 414" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Size on disk and load time</title>
<desc id="d">Bytes on disk per system, heap and primary key against index or columnar data, with the load time.</desc>
<rect x="0.5" y="0.5" width="879" height="413" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="20" y="30" font-size="16" text-anchor="start" fill="#e6edf3" font-weight="bold">Size on disk and load time, 1,000,000 orders</text>
<text x="20" y="48" font-size="12" text-anchor="start" fill="#9198a1">MiB; the heap and primary key apart from the index or columnar data the system keeps beside them</text>
<rect x="20" y="66" width="12" height="12" fill="#9198a1" rx="2"/>
<text x="38" y="77" font-size="12" text-anchor="start" fill="#e6edf3">heap and primary key</text>
<circle cx="190" cy="72" r="4.5" fill="#3987e5" stroke="#0d1117" stroke-width="2" paint-order="stroke"></circle>
<text x="202" y="77" font-size="12" text-anchor="start" fill="#e6edf3">index or columnar data (system colour)</text>
<text x="20" y="125" font-size="12" text-anchor="start" fill="#e6edf3">PostgreSQL</text>
<rect x="170" y="110" width="452.6" height="22" fill="#565b63" rx="3"><title>PostgreSQL: heap and primary key 124.2 MiB</title></rect>
<rect x="623.6" y="110" width="126.4" height="22" fill="#8b949e" rx="3"><title>PostgreSQL: index or columnar data 34.6 MiB</title></rect>
<text x="758" y="126" font-size="12" text-anchor="start" fill="#e6edf3" font-weight="bold">159 MiB</text>
<text x="860" y="126" font-size="12" text-anchor="end" fill="#9198a1">load 2.2 s</text>
<text x="20" y="165" font-size="12" text-anchor="start" fill="#e6edf3">pg_sift sift_col</text>
<rect x="170" y="150" width="452.6" height="22" fill="#565b63" rx="3"><title>pg_sift sift_col: heap and primary key 124.2 MiB</title></rect>
<rect x="623.6" y="150" width="68.3" height="22" fill="#3987e5" rx="3"><title>pg_sift sift_col: index or columnar data 18.7 MiB</title></rect>
<text x="699.9" y="166" font-size="12" text-anchor="start" fill="#e6edf3" font-weight="bold">143 MiB</text>
<text x="860" y="166" font-size="12" text-anchor="end" fill="#9198a1">load 1.4 s</text>
<text x="20" y="205" font-size="12" text-anchor="start" fill="#e6edf3">pg_sift sift_table</text>
<rect x="170" y="190" width="77.2" height="22" fill="#565b63" rx="3"><title>pg_sift sift_table: heap and primary key 21.4 MiB</title></rect>
<rect x="248.2" y="190" width="76.7" height="22" fill="#199e70" rx="3"><title>pg_sift sift_table: index or columnar data 21.0 MiB</title></rect>
<text x="333.2" y="206" font-size="12" text-anchor="start" fill="#e6edf3" font-weight="bold">42 MiB</text>
<text x="860" y="206" font-size="12" text-anchor="end" fill="#9198a1">load 3.3 s</text>
<text x="20" y="245" font-size="12" text-anchor="start" fill="#e6edf3">Elasticsearch</text>
<rect x="170" y="230" width="406.5" height="22" fill="#9085e9" rx="3"><title>Elasticsearch: index or columnar data 111.3 MiB</title></rect>
<text x="584.5" y="246" font-size="12" text-anchor="start" fill="#e6edf3" font-weight="bold">111 MiB</text>
<text x="860" y="246" font-size="12" text-anchor="end" fill="#9198a1">load 10.5 s</text>
<text x="20" y="285" font-size="12" text-anchor="start" fill="#e6edf3">ClickHouse</text>
<rect x="170" y="270" width="137.3" height="22" fill="#c98500" rx="3"><title>ClickHouse: index or columnar data 37.6 MiB</title></rect>
<text x="315.3" y="286" font-size="12" text-anchor="start" fill="#e6edf3" font-weight="bold">38 MiB</text>
<text x="860" y="286" font-size="12" text-anchor="end" fill="#9198a1">load 0.7 s</text>
<text x="20" y="325" font-size="12" text-anchor="start" fill="#e6edf3">Citus columnar</text>
<rect x="170" y="310" width="77.2" height="22" fill="#565b63" rx="3"><title>Citus columnar: heap and primary key 21.4 MiB</title></rect>
<rect x="248.2" y="310" width="90.2" height="22" fill="#d55181" rx="3"><title>Citus columnar: index or columnar data 24.7 MiB</title></rect>
<text x="346.4" y="326" font-size="12" text-anchor="start" fill="#e6edf3" font-weight="bold">46 MiB</text>
<text x="860" y="326" font-size="12" text-anchor="end" fill="#9198a1">load 1.3 s</text>
<text x="20" y="360" font-size="11" text-anchor="start" fill="#9198a1">sift_col shares PostgreSQL's heap and primary key: its column index and its text index are what it adds.</text>
<text x="20" y="376" font-size="11" text-anchor="start" fill="#9198a1">Data: docs/results/store.json, 2026-10-22. Host: AMD Ryzen 7 9700X, 16 threads, 8g per server.</text>
<text x="20" y="392" font-size="11" text-anchor="start" fill="#9198a1">PostgreSQL 18.6, pg_sift 3.2, Elasticsearch 9.5.5, ClickHouse 26.9.19.9, Citus 14.2-1. Load: data, indexes, merge, one client.</text>
</svg>
