<polygon points="351.1,346.9 358.3,354 351.1,361.1 344,354" fill="#199e70" stroke="#0d1117" stroke-width="2" paint-order="stroke"><title>29 real query shapes, 1.2M orders: median 3.2×</title></polygon>
