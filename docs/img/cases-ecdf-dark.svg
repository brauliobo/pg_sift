<text x="82" y="473" font-size="12" text-anchor="end" fill="#9198a1">25%</text>
<line x1="90" y1="354" x2="960" y2="354" stroke="#262c34" stroke-width="1"/>
<text x="82" y="358" font-size="12" text-anchor="end" fill="#9198a1">50%</text>
<line x1="90" y1="239" x2="960" y2="239" stroke="#262c34" stroke-width="1"/>
<text x="82" y="243" font-size="12" text-anchor="end" fill="#9198a1">75%</text>
<line x1="90" y1="124" x2="960" y2="124" stroke="#262c34" stroke-width="1"/>
<text x="82" y="128" font-size="12" text-anchor="end" fill="#9198a1">100%</text>
<line x1="118.1" y1="124" x2="118.1" y2="584" stroke="#262c34" stroke-width="1"/>
<text x="118.1" y="604" font-size="12" text-anchor="middle" fill="#9198a1">0.5×</text>
<line x1="205.4" y1="124" x2="205.4" y2="584" stroke="#9198a1" stroke-width="1.5"/>
<text x="205.4" y="604" font-size="12" text-anchor="middle" fill="#9198a1">1×</text>
<line x1="292.7" y1="124" x2="292.7" y2="584" stroke="#262c34" stroke-width="1"/>
<text x="292.7" y="604" font-size="12" text-anchor="middle" fill="#9198a1">2×</text>
<line x1="408.1" y1="124" x2="408.1" y2="584" stroke="#262c34" stroke-width="1"/>
<text x="408.1" y="604" font-size="12" text-anchor="middle" fill="#9198a1">5×</text>
<line x1="495.4" y1="124" x2="495.4" y2="584" stroke="#262c34" stroke-width="1"/>
<text x="495.4" y="604" font-size="12" text-anchor="middle" fill="#9198a1">10×</text>
<line x1="582.7" y1="124" x2="582.7" y2="584" stroke="#262c34" stroke-width="1"/>
<text x="582.7" y="604" font-size="12" text-anchor="middle" fill="#9198a1">20×</text>
<line x1="698.1" y1="124" x2="698.1" y2="584" stroke="#262c34" stroke-width="1"/>
<text x="698.1" y="604" font-size="12" text-anchor="middle" fill="#9198a1">50×</text>
<line x1="785.4" y1="124" x2="785.4" y2="584" stroke="#262c34" stroke-width="1"/>
<text x="785.4" y="604" font-size="12" text-anchor="middle" fill="#9198a1">100×</text>
<line x1="872.7" y1="124" x2="872.7" y2="584" stroke="#262c34" stroke-width="1"/>
<text x="872.7" y="604" font-size="12" text-anchor="middle" fill="#9198a1">200×</text>
<text x="525" y="628" font-size="12" text-anchor="middle" fill="#9198a1">speed-up over PostgreSQL (time of PostgreSQL / time of pg_sift)</text>
