<polygon points="351.1,346.9 358.3,354 351.1,361.1 344,354" fill="#1baf7a" stroke="#ffffff" stroke-width="2" paint-order="stroke"><title>29 real query shapes, 1.2M orders: median 3.2×</title></polygon>
<polygon points="630,184.2 635.9,190 630,195.8 624.1,190" fill="#1baf7a" stroke="#ffffff" stroke-width="2" paint-order="stroke"></polygon>
<text x="644" y="194" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">29 real query shapes, 1.2M orders</text>
<text x="644" y="212" font-size="12" text-anchor="start" fill="#59636e">median 3.2×, slower on 7 (24%)</text>
<text x="20" y="652" font-size="12" text-anchor="start" fill="#59636e">Data: docs/results/cases.tsv (one backend, no parallel workers, PostgreSQL = the same table with sift.enable_agg = off) and</text>
<text x="20" y="669" font-size="12" text-anchor="start" fill="#59636e">docs/results/analytics.json (shapes G1-G8 at one filter and S1-S7 at three filter sizes, wall time of one backend). The two sets are different</text>
