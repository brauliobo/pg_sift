<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="711" viewBox="0 0 1000 711" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Distribution of the speed-up</title>
<desc id="d">Share of benchmark cases and of real query shapes at least as fast as x times PostgreSQL.</desc>
<rect x="0.5" y="0.5" width="999" height="710" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
<text x="20" y="32" font-size="18" text-anchor="start" fill="#1f2328" font-weight="bold">How many cases get how much faster</text>
<text x="20" y="54" font-size="13" text-anchor="start" fill="#59636e">The share of cases whose speed-up over PostgreSQL is at least x, on a logarithmic axis. A curve that stays high to the right wins</text>
<text x="20" y="72" font-size="13" text-anchor="start" fill="#59636e">by a lot on most cases; the part left of 1× are the cases where pg_sift is slower.</text>
<line x1="90" y1="584" x2="960" y2="584" stroke="#e3e7eb" stroke-width="1"/>
<text x="82" y="588" font-size="12" text-anchor="end" fill="#59636e">0%</text>
<line x1="90" y1="469" x2="960" y2="469" stroke="#e3e7eb" stroke-width="1"/>
<text x="82" y="473" font-size="12" text-anchor="end" fill="#59636e">25%</text>
<line x1="90" y1="354" x2="960" y2="354" stroke="#e3e7eb" stroke-width="1"/>
<text x="82" y="358" font-size="12" text-anchor="end" fill="#59636e">50%</text>
<line x1="90" y1="239" x2="960" y2="239" stroke="#e3e7eb" stroke-width="1"/>
<text x="82" y="243" font-size="12" text-anchor="end" fill="#59636e">75%</text>
<line x1="90" y1="124" x2="960" y2="124" stroke="#e3e7eb" stroke-width="1"/>
<text x="82" y="128" font-size="12" text-anchor="end" fill="#59636e">100%</text>
<line x1="118.1" y1="124" x2="118.1" y2="584" stroke="#e3e7eb" stroke-width="1"/>
<text x="118.1" y="604" font-size="12" text-anchor="middle" fill="#59636e">0.5×</text>
<line x1="205.4" y1="124" x2="205.4" y2="584" stroke="#59636e" stroke-width="1.5"/>
<text x="205.4" y="604" font-size="12" text-anchor="middle" fill="#59636e">1×</text>
<line x1="292.7" y1="124" x2="292.7" y2="584" stroke="#e3e7eb" stroke-width="1"/>
<text x="292.7" y="604" font-size="12" text-anchor="middle" fill="#59636e">2×</text>
<line x1="408.1" y1="124" x2="408.1" y2="584" stroke="#e3e7eb" stroke-width="1"/>
<text x="408.1" y="604" font-size="12" text-anchor="middle" fill="#59636e">5×</text>
<line x1="495.4" y1="124" x2="495.4" y2="584" stroke="#e3e7eb" stroke-width="1"/>
<text x="495.4" y="604" font-size="12" text-anchor="middle" fill="#59636e">10×</text>
<line x1="582.7" y1="124" x2="582.7" y2="584" stroke="#e3e7eb" stroke-width="1"/>
<text x="582.7" y="604" font-size="12" text-anchor="middle" fill="#59636e">20×</text>
<line x1="698.1" y1="124" x2="698.1" y2="584" stroke="#e3e7eb" stroke-width="1"/>
<text x="698.1" y="604" font-size="12" text-anchor="middle" fill="#59636e">50×</text>
<line x1="785.4" y1="124" x2="785.4" y2="584" stroke="#e3e7eb" stroke-width="1"/>
<text x="785.4" y="604" font-size="12" text-anchor="middle" fill="#59636e">100×</text>
<line x1="872.7" y1="124" x2="872.7" y2="584" stroke="#e3e7eb" stroke-width="1"/>
<text x="872.7" y="604" font-size="12" text-anchor="middle" fill="#59636e">200×</text>
