  <rect class="card" x="0.5" y="0.5" width="859" height="495" rx="10" stroke-width="1"/>
  <text class="title" x="24" y="34" font-size="16">On-Disk Storage Footprint: 10M Orders &amp; 50K Wikipedia BM25 Index</text>
  <text class="sub" x="24" y="53" font-size="11.5">On-disk size (MiB, lower is better) · 10M orders total footprint (top) and 50K Wikipedia BM25 index (bottom)</text>
