  <text class="sublabel" x="836" y="433" font-size="10" text-anchor="end">3.8 s (+100 MiB table)</text>
  <text class="sub" x="24" y="478" font-size="9.8">Data: store-scaling.json (10M-c3), duckdb-10000000.tsv &amp; articles.tsv · 2026-10-27 (v3.5 baseline). PG rum adds 100.3 MiB stored tsvector.</text>
