  <text class="val" x="481" y="409" font-size="11">70.5 MiB</text>
  <text class="sublabel" x="836" y="409" font-size="10" text-anchor="end">3.3 s + 1.3 s merge</text>
  <text class="sublabel" x="182" y="433" font-size="11.5" text-anchor="end">PG rum (tsvector)</text>
