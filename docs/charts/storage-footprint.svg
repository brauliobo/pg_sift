<svg xmlns="http://www.w3.org/2000/svg" width="860" height="496" viewBox="0 0 860 496" role="img" aria-labelledby="t d" font-family='Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif'>
  <title id="t">On-Disk Storage Footprint: 10M Orders &amp; 50K Wikipedia BM25 Index</title>
  <desc id="d">10M orders: DuckDB (Parquet) 297 MiB, ClickHouse 26.9 421 MiB, pg_sift (sift_table) 457 MiB, Citus 14.2 columnar 463 MiB, pg_sift (sift_col + heap) 1,438 MiB, Elasticsearch 9.5 1,457 MiB, PostgreSQL 18 (stock) 1,549 MiB; 50K Wikipedia BM25: pg_sift (positions=off) 12.0 MiB, pg_sift (default) 30.2 MiB, pg_textsearch 1.5 40.1 MiB, ParadeDB (pg_search) 54.5 MiB, Elasticsearch 9.5 70.5 MiB, PG rum (tsvector) 85.7 MiB</desc>
