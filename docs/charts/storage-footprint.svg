  <text class="val" x="359.4" y="361" font-size="11">40.1 MiB</text>
  <text class="sublabel" x="836" y="361" font-size="10" text-anchor="end">5.1 s build</text>
  <text class="sublabel" x="182" y="385" font-size="11.5" text-anchor="end">ParadeDB (pg_search)</text>
  <rect class="c-paradedb" x="192" y="374" width="218" height="14" rx="3"/>
  <text class="val" x="417" y="385" font-size="11">54.5 MiB</text>
  <text class="sublabel" x="836" y="385" font-size="10" text-anchor="end">0.6 s build</text>
  <text class="sublabel" x="182" y="409" font-size="11.5" text-anchor="end">Elasticsearch 9.5</text>
