  <title id="t">Analytical Aggregations: pg_sift vs ClickHouse, DuckDB, and PostgreSQL 18</title>
  <desc id="d">Count by country: pg_sift 0.85 ms, ClickHouse 9.32 ms, DuckDB 8.97 ms, PG 18 189 ms; Revenue / month: pg_sift 0.93 ms, ClickHouse 23.8 ms, DuckDB 99.2 ms, PG 18 1,377 ms; Top 10 categories: pg_sift 0.90 ms, ClickHouse 21.0 ms, DuckDB 26.7 ms, PG 18 370 ms; Avg shipped order: pg_sift 10.0 ms, ClickHouse 7.68 ms, DuckDB 48.9 ms, PG 18 124 ms; Distinct / month: pg_sift 49.3 ms, ClickHouse 105 ms, DuckDB 194 ms, PG 18 2,334 ms; Big recent orders: pg_sift 10.6 ms, ClickHouse 4.39 ms, DuckDB 39.7 ms, PG 18 146 ms</desc>
